[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberpath-ai"
version = "0.4.2"
description = "Personal cybersecurity education Telegram bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3,<4",
    "openai>=2,<3",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["cyberpath_ai*"]

[tool.setuptools.package-data]
"cyberpath_ai.academy" = ["skills.json", "resources.json"]
"cyberpath_ai.academy.lessons" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
